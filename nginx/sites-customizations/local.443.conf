server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com; # TODO: inject url depending on production mode: localhost or real domain(s).

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # TODO: inject path (make volume)
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem; # TODO: inject path (make volume)

    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 60m;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # everything is passed to Gunicorn
        proxy_pass http://app_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        client_max_body_size 50M; # allow up to 50MB user-provided file-upload size.
    }

    location /static-vuedj/ { # TODO: inject location
        root /;
    }

    location /media/ { # TODO: inject location
        root /;
    }
}
