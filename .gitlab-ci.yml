stages:
  - update
  - build
  - test
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375/
  # When using dind, it's wise to use the overlayfs driver for
  # improved performance.
  DOCKER_DRIVER: overlay2
  BUILDER_IMAGE: "docker.gitlab.electrocnic.com/dood/app/builder:latest"

services:
  - docker:dind

before_script:
  - docker info
  - pwd
  - ls -la
  - echo "CI_BUILDS_DIR = ${CI_BUILDS_DIR}"
  - echo $CI_BUILDS_DIR
  - chmod 755 *.sh || echo "Did not find any scripts to set execute permissions."
  - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN docker.gitlab.electrocnic.com

update-runner:
  stage: update
  image: "docker:stable"
  script:
    - sh update_builder.sh

verify-build:
  stage: build
  image: $BUILDER_IMAGE
  script:
    - sh build.sh

run-tests:
  stage: test
  script:
    - sh run_tests.sh
